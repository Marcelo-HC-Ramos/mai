version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mai-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mairoot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secure_password_change_this}
    volumes:
      - mongo-data:/data/db
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mai-net

  redis:
    image: redis:7-alpine
    container_name: mai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_change_this}
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mai-net

  api:
    build: .
    container_name: mai-api
    restart: unless-stopped
    env_file: .env
    environment:
      MAI_MONGO_URI: mongodb://${MONGO_USER:-mairoot}:${MONGO_PASSWORD:-secure_password_change_this}@mongo:27017/mai?authSource=admin
      MAI_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_this}@redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mai-net

  worker:
    build: .
    container_name: mai-worker
    restart: unless-stopped
    env_file: .env
    environment:
      MAI_MONGO_URI: mongodb://${MONGO_USER:-mairoot}:${MONGO_PASSWORD:-secure_password_change_this}@mongo:27017/mai?authSource=admin
      MAI_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_this}@redis:6379/0
    command: celery -A mai.tasks worker -B --loglevel=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mai-net

volumes:
  mongo-data:
  redis-data:

networks:
  mai-net:
    driver: bridge
